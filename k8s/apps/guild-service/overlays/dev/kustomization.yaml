apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
resources:
- ../../base
- ./ingressroute.yaml
- ./configmap.yaml
- ./secret.yaml
patches:
- path: ./deployment-patch.yaml
  target:
    kind: Deployment
    name: guild-deployment
- path: ./serviceaccount-patch.yaml
images:
- name: vincentramaputra/viscord-guild-service
  newTag: sha-db0275b
