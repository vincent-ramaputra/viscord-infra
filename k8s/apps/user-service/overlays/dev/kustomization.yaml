apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ./ingressroute.yaml
configMapGenerator:
  - name: user-config
    envs:
      - ./config.env
secretGenerator:
  - name: user-secret
    envs:
      - ./secret.env
generatorOptions:
  labels:
    app: user
patches:
  - path: ./deployment-patch.yaml
  - path: ./serviceaccount-patch.yaml

