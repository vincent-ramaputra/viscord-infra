apiVersion: v1
kind: ConfigMap
metadata:
  name: user-configmap
  labels:
    app: user
data:
  APP_PORT: "3000"
  GRPC_PORT: "5000"
  DB_HOST: "localhost"
  DB_PORT: "5432"
  DB_NAME: "viscord_user"
