apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- ./ingressroute.yaml
configMapGenerator:
  - name: auth-config
    envs:
      - config.env
secretGenerator:
  - name: auth-secret
    envs:
      - secret.env
generatorOptions:
  labels:
    app: auth
patches:
  - path: ./deployment-patch.yaml
  - path: ./serviceaccount-patch.yaml