mode: deployment

config:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
  processors:
    k8sattributes: {}
    batch: {}
  exporters:
    otlp:
      endpoint: http://tempo-distributor.monitoring:4317
  service:
    pipelines:
      traces:
        receivers:
        - otlp
        processors:
        - k8sattributes
        - batch
        exporters:
        - debug

presets:
  kubernetesAttributes: 
    enabled: true

image:
  repository: otel/opentelemetry-collector-k8s