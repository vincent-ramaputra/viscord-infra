mode: deployment

config:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
  processors:
    k8sattributes: {}
    batch: {}
  exporters:
    otlp:
      endpoint: tempo-distributor.monitoring:4317
      tls:
        insecure: true
  service:
    pipelines:
      traces:
        receivers:
        - otlp
        processors:
        - k8sattributes
        - batch
        exporters:
        - otlp

presets:
  kubernetesAttributes: 
    enabled: true

image:
  repository: otel/opentelemetry-collector-k8s