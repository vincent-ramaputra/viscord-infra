api:
  dashboard: true
  insecure: false

ingressRoute:
  dashboard:
    enabled: true
    entryPoints:
      - websecure
    matchRule: Host(`traefik.dev.viscord.app`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))
    # tls:
    #   certResolver: letsencrypt

ports:
  web:
    port: 80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: http
          permanent: true
  websecure:
    port: 443
    http:
      tls:
        enabled: false

service:
  type: LoadBalancer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "arn:aws:acm:ap-southeast-3:409684965426:certificate/9c4ade25-5d17-4f6d-86ac-ddd2195ced01"
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
    external-dns.alpha.kubernetes.io/hostname: "dev.viscord.app,*.dev.viscord.app"

certificatesResolvers:
  # letsencrypt:
  #   acme: 
  #     caServer: https://acme-staging-v02.api.letsencrypt.org/directory
  #     email: "vincentramaputra123@gmail.com"
  #     storage: "/data/acme.json"
  #     dnsChallenge:
  #       provider: route53
  #       resolvers:
  #         - "1.1.1.1:53"
  #         - "8.8.8.8:53"

      # httpChallenge:
      #   entryPoint: "web"

persistence:
  enabled: true
  size: 128Mi

securityContext:
  readOnlyRootFilesystem: false

podSecurityContext:
  fsGroup: null
  runAsGroup: 0
  runAsUser: 0
  runAsNonRoot: false


providers:
  kubernetesCRD:
    allowCrossNamespace: true

logs:
  general:
    level: DEBUG
  access:
    enabled: true
    fields:
      defaultMode: keep
      names:
        RequestPath: keep
        RequestMethod: keep
        DownstreamStatus: keep