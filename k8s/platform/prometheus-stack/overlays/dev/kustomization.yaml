apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
# bases:
#   - ../../base
resources:
  - ./ingressroute.yaml
  - ./grafana-admin-secret.yaml
configMapGenerator:
  - name: logs-overview-dashboard
    files:
      - ./grafana/dashboards/logs-overview.json
generatorOptions:
  labels:
    grafana_dashboard: "1"