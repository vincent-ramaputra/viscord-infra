apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-dev
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/Laevateinn17/viscord-infra.git
      targetRevision: HEAD
      path: k8s/infra/external-secrets/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
      refresh: true
    syncOptions:
      - ServerSideApply=true
