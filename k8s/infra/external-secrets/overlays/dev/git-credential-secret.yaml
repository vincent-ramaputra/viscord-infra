apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: git-credentials-secret
spec:
  secretStoreRef:
    name: gcp-secretstore
    kind: ClusterSecretStore
  target:
    name: git-credentials-secret  
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
  dataFrom:
    - extract:
        key: argocd-repo-credentials