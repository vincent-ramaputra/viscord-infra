api:
  dashboard: true
  insecure: false

ingressRoute:
  dashboard:
    enabled: true
    entryPoints:
      - web
      - websecure
    matchRule: Host(`viscord.test`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))

ports:
  web:
    port: 80
  websecure:
    port: 443

service:
  type: LoadBalancer
  spec:
    loadBalancerIP: 34.101.89.196

entryPoints:
  web:
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https

logs:
  general:
    level: DEBUG