api:
  dashboard: true
  insecure: false

ingressRoute:
  dashboard:
    enabled: true
    entryPoints:
      - web
      - websecure
    matchRule: Host(`viscord.test`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))

ports:
  web:
    port: 80
  websecure:
    port: 443

service:
  type: LoadBalancer

logs:
  general:
    level: DEBUG