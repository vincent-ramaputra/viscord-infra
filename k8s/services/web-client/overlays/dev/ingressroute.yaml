apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: web-ingressroute
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`dev.viscord.app`) && !(PathPrefix(`/api`) || PathPrefix(`/.well-known`))
      kind: Rule
      priority: 1
      services:
        - name: web-service
          port: 3000