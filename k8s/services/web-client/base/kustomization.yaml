apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./deployment.yaml
  - ./service.yaml
labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app: web
  - includeSelectors: false
    includeTemplates: true
    pairs:
      app.kubernetes.io/part-of: viscord