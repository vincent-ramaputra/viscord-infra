apiVersion: apps/v1
kind: Deployment
metadata:
  name: guild-deployment
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: guild
          envFrom:
          # - configMapRef:
          #     name: db-config
          - configMapRef:
              name: guild-configmap
          - secretRef:
              name: guild-secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"