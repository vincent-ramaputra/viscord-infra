apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-deployment
spec:
  template:
    spec:
      serviceAccountName: user-ksa
      containers:
        - name: user
          image: vincentramaputra/viscord-user-service
          envFrom:
          - configMapRef:
              name: user-configmap
          - configMapRef:
              name: db-config
          - secretRef:
              name: user-db-secret
          ports:
          - name: http
            containerPort: 3000
          - name: grpc
            containerPort: 5000