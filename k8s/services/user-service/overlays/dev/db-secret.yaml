apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: user-db-secret
spec:
  secretStoreRef:
    name: aws-secretstore
    kind: ClusterSecretStore
  target:
    name: user-db-secret
    template:
      data:
        DB_USER: "{{ .username }}"
        DB_PASSWORD: "{{ .password  }}"
  dataFrom:
  - extract:
      key: app-db-secret-dev
