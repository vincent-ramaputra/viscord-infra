apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-deployment
spec:
  replicas: 1
  template:
    spec:
      serviceAccountName: auth-ksa
      containers:
        - name: auth
          image: vincentramaputra/viscord-auth-service
          envFrom:
          - configMapRef:
              name: auth-configmap
          - secretRef:
              name: auth-secret
          ports:
          - name: http
            containerPort: 3000
