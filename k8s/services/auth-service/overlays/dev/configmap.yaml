apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-configmap
  labels:
    app: auth
data:
  NODE_ENV: "development"
  APP_PORT: "3000"
  # DB_HOST: "localhost"
  # DB_PORT: "5432"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://opentelemetry-collector.monitoring:4318"
  DB_NAME: "viscord_auth"
  DB_SSL_REJECT_UNAUTHORIZED: "false"
  USER_SERVICE_HOST: "user-service"
  USER_SERVICE_PORT: "3000"
  RMQ_HOST: "message-broker-service"
  RMQ_PORT: "5672"

