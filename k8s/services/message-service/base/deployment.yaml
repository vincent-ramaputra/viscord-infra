apiVersion: apps/v1
kind: Deployment
metadata:
  name: message-deployment
spec:
  template:
    spec:
      serviceAccountName: message-ksa
      containers:
      - name: message
        image: vincentramaputra/viscord-message-service
        envFrom:
        - configMapRef:
            name: message-configmap
        - secretRef:
            name: message-secret
        ports:
        - name: http
          containerPort: 8080
        - name: grpc
          containerPort: 9090
