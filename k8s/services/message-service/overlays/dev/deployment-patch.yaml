apiVersion: apps/v1
kind: Deployment
metadata:
  name: message-deployment
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: message
          envFrom:
          # - configMapRef:
          #     name: db-config
          - configMapRef:
              name: message-configmap
          - secretRef:
              name: message-secret
          resources:
            requests:
              memory: "512Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"