apiVersion: v1
kind: ConfigMap
metadata:
  name: ws-gateway-configmap
  labels:
    app: ws-gateway
data:
  WS_PORT: "80"
  RMQ_HOST: "message-broker-service"
  RMQ_PORT: "5672"
  SFU_SERVICE_HOST: "sfu"
  SFU_SERVICE_PORT: "3000"
  GUILD_SERVICE_HOST: "guild-service"
  GUILD_SERVICE_PORT: "3000"
  GUILD_SERVICE_GRPC_PORT: "5000"
  USER_SERVICE_HOST: "user-service"
  USER_SERVICE_PORT: "3000"
  USER_SERVICE_GRPC_PORT: "5000"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://opentelemetry-collector.monitoring:4318"