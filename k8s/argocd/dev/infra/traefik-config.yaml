apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-config-dev
  namespace: argocd
spec:
  project: default
  source:
    chart: traefik
    repoURL: https://github.com/Laevateinn17/viscord-infra.git
    targetRevision: HEAD
    path: k8s/infra/traefik/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
      refresh: true
    syncOptions:
      - CreateNamespace=True