apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ws-gateway
  labels:
    app: ws-gateway
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`viscord.local`) && (PathPrefix(`/ws`) || PathPrefix(`/socket.io`))
      middlewares:
        - name: forward-auth
      services:
        - name: ws-gateway
          port: 80
