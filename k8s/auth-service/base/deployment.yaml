apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    spec:
      containers:
      - name: auth
        image: vincentramaputra/viscord-auth-service
        envFrom:
        - configMapRef:
            name: auth-config
        - secretRef:
            name: auth-secret
        ports:
        - name: http
          containerPort: 3000