name: Scale down dev cluster nodes to 0

on:
  schedule:
    - cron: "0 14 * * *"

jobs:
  scale-down:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/.../providers/...
          service_account: your-sa@project.iam.gserviceaccount.com
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          cli_config_credentials_token: ${{ secrets.HCP_API_TOKEN }}
      - run: terraform init
      - name: Perform node scaling
        run:  terraform apply -var "dev_node_count=0" -auto-approve
