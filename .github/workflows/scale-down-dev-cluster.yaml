name: Scale down dev cluster nodes to 0

on:
  schedule:
    - cron: "5 21 * * *"
      timezon: "Asia/Jakarta"

jobs:
  scale-down:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          cli_config_credentials_token: ${{ secrets.HCP_API_TOKEN }}
      - run: terraform init
      - name: Perform node scaling
        run:  terraform apply -var "dev_node_count=0" -auto-approve
